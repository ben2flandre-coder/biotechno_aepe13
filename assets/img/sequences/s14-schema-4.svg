<text x="58" y="352" font-size="18" fill="#0f172a" font-family="Arial">Message pédagogique clé</text>
<text x="58" y="382" font-size="15" fill="#0f172a" font-family="Arial">En mobilité, le risque augmente avec la distance aux ressources ; la préparation matérielle conditionne la capacité de r</text>
<text x="58" y="412" font-size="15" fill="#0f172a" font-family="Arial">Erreur à éviter: partir avec une trousse non vérifiée</text>
<text x="58" y="442" font-size="15" fill="#0f172a" font-family="Arial">Limite: Les aléas météo peuvent invalider un protocole pensé pour conditions stables.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<rect width="1180" height="620" fill="#f8fafc"/>
<rect x="25" y="20" width="1130" height="70" rx="12" fill="#1e3a8a"/>
<text x="45" y="64" fill="#fff" font-size="28" font-family="Arial">S11 — analyse erreurs interpretation — Gérer la cohabitation des risques en accueil multi-âge</text>
<rect x="40" y="120" width="240" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
<text x="55" y="155" font-size="16" font-family="Arial">1. Détection écart</text>
<text x="55" y="182" font-size="14" font-family="Arial">Signal faible + signal fort</text>
<rect x="330" y="120" width="240" height="110" rx="10" fill="#dcfce7" stroke="#16a34a"/>
<text x="345" y="155" font-size="16" font-family="Arial">2. Analyse causes</text>
<text x="345" y="182" font-size="14" font-family="Arial">Variables + limites</text>
<rect x="620" y="120" width="240" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
<text x="635" y="155" font-size="16" font-family="Arial">3. Choix option</text>
<text x="635" y="182" font-size="14" font-family="Arial">N1/N2/N3 décision</text>
<rect x="910" y="120" width="240" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
<text x="925" y="155" font-size="16" font-family="Arial">4. Preuve EP3</text>
<text x="925" y="182" font-size="14" font-family="Arial">Trace + justification</text>
<line x1="280" y1="175" x2="330" y2="175" stroke="#334155" stroke-width="3"/>
<line x1="570" y1="175" x2="620" y2="175" stroke="#334155" stroke-width="3"/>
<line x1="860" y1="175" x2="910" y2="175" stroke="#334155" stroke-width="3"/>
<rect x="40" y="270" width="1110" height="320" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="55" y="305" font-size="18" font-family="Arial">Flux complet</text>
<text x="55" y="336" font-size="14" font-family="Arial">• Niveau 1: suppression immédiate du danger.</text>
<text x="55" y="364" font-size="14" font-family="Arial">• Niveau 2: stabilisation par contrôle des variables critiques.</text>
<text x="55" y="392" font-size="14" font-family="Arial">• Niveau 3: prévention durable et retour d’expérience équipe.</text>
<text x="55" y="430" font-size="14" font-family="Arial">• Erreurs d’interprétation: fréquence ≠ gravité, visuel ≠ maîtrise, routine ≠ conformité.</text>
<text x="55" y="458" font-size="14" font-family="Arial">• Limite: action invalide si conditions d’application non vérifiées.</text>
<text x="55" y="486" font-size="14" font-family="Arial">• Contre-exemple: une option plus lente peut réduire le risque résiduel global.</text>
</svg>
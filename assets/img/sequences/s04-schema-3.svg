<text x="58" y="352" font-size="18" fill="#0f172a" font-family="Arial">Message pédagogique clé</text>
<text x="58" y="382" font-size="15" fill="#0f172a" font-family="Arial">La croissance bactérienne suit une cinétique exponentielle dans la zone de danger thermique ; chaque minute hors plage s</text>

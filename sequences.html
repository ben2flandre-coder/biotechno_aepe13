<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>15 séquences — Plateforme de cours CAP AEPE</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-base="./" data-page="sequences.html">
<main>
  <section class="card">
    <h2>Séquences formateur CAP AEPE (animation 2–3h)</h2>
    <p>Chaque séquence est différenciée scientifiquement et pédagogiquement : mécanismes causaux, options décisionnelles, protocole terrain, erreur candidat CAP et arbitrage formateur.</p>
    <div id="seqStats"></div>
    <div class="toolbar"><input id="searchSeq" type="search" placeholder="Filtrer par titre, ID, problème métier"></div>
    <div id="seqList" class="list"></div>
  </section>
<div id="seqOverlay" class="overlay" data-overlay aria-modal="true" role="dialog">
    <article class="dialog"><button class="close" aria-label="Fermer">✕</button><div id="seqBody"></div></article>
  </div>
</main>
<script src="assets/js/common.js"></script>
<script src="assets/js/loaders.js"></script>
<script src="assets/js/sequences.js"></script>
</body>
</html>

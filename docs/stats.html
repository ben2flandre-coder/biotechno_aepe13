<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats contenus — CAP AEPE</title><link rel="stylesheet" href="../assets/css/app.css"></head>
<body data-base="../" data-page="docs/index.html">
<main>
<section class="card"><h2>Statistiques visibles — Refonte expert</h2><div id="globalStats"></div></section>
<section id="statsTable" class="card"></section>
<section class="card"><h3>Diagnostic technique (dev)</h3><ul id="techDiagnostics"></ul></section>
</main>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/loaders.js"></script>
<script>
(async function(){
  const seqs = await loadData('../data/sequences.json','sequences',[]);
  const minWords = Math.min(...seqs.map(s => s.stats?.wordCount || 0));
  const all9 = seqs.every(s => s.stats?.has9Blocks === true);
  const allSci = seqs.every(s => s.bloc4_fondScientifique && s.bloc4_fondScientifique.mecanismes);
  const allOptions = seqs.every(s => (s.bloc7_tableauOptions || []).length === 3);
  const allSchemas = seqs.every(s => (s.stats?.schemaCount || 0) >= 3);
  document.getElementById('globalStats').innerHTML = `<span class='badge'>Séquences: ${seqs.length}</span> <span class='badge'>Min mots: ${minWords}</span> <span class='badge'>9 blocs: ${all9?'OK':'KO'}</span> <span class='badge'>Fond scientifique: ${allSci?'OK':'KO'}</span> <span class='badge'>3 options décisionnelles: ${allOptions?'OK':'KO'}</span> <span class='badge'>3 schémas: ${allSchemas?'OK':'KO'}</span>`;
  document.getElementById('statsTable').innerHTML = `<h3>Détail validation</h3><table class='table'><thead><tr><th>ID</th><th>Mots</th><th>Situations</th><th>Tableau erreurs</th><th>Tableau options</th><th>Schémas</th><th>Fond scientifique</th></tr></thead><tbody>${seqs.map(s=>`<tr><td>${s.id}</td><td>${s.stats?.wordCount||0}</td><td>${s.stats?.situationsCount||0}</td><td>${(s.bloc6_tableauPedagogique||[]).length}</td><td>${(s.bloc7_tableauOptions||[]).length}</td><td>${s.stats?.schemaCount||0}</td><td>${s.bloc4_fondScientifique?'Oui':'Non'}</td></tr>`).join('')}</tbody></table>`;
})();
</script>
</body></html>

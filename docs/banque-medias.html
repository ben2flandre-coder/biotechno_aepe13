<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banque médias</title><link rel="stylesheet" href="../assets/css/app.css"></head>
<body data-base="../" data-page="docs/index.html">
<main>
<section class="card"><h2>Banque médias inspectable</h2><p>Inventaire des médias locaux utilisés par les séquences/capsules.</p></section>
<section id="mediaList" class="list">
  <article class="card"><h3>Fallback médias (chargement JS requis pour inventaire complet)</h3>
  <table class="table"><thead><tr><th>Titre</th><th>Thème</th><th>Source</th><th>Licence</th></tr></thead><tbody id="mediaFallbackRows"></tbody></table></article>
</section>
</main>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/loaders.js"></script>
<script>
const fallbackMedia = [
  ['Chaîne contamination','microbiologie','Santé publique France','Usage pédagogique local'],
  ['Flore microbienne','microbiologie','INRS','Usage pédagogique local'],
  ['Schéma contamination surfaces','microbiologie','CPIAS','Usage pédagogique local'],
  ['Hygiène des mains','hygiene','Ministère de la Santé','Usage pédagogique local'],
  ['Circuit linge propre/sale','linge','INRS','Usage pédagogique local'],
  ['Zonage locaux','locaux','CPIAS','Usage pédagogique local'],
  ['Dilution désinfectant','produits','INRS','Usage pédagogique local'],
  ['Temps de contact','produits','ANSES','Usage pédagogique local'],
  ['Barrière EPI','securite','INRS','Usage pédagogique local'],
  ['Arbitrage EP3','qualite','Éducation nationale','Usage pédagogique local'],
  ['Protocole bionettoyage','locaux','CPIAS','Usage pédagogique local'],
  ['Transmission manuportée','microbiologie','Santé publique France','Usage pédagogique local'],
  ['AES conduite à tenir','sante','Ministère de la Santé','Usage pédagogique local'],
  ['Collation sécurisée','alimentaire','ANSES','Usage pédagogique local'],
  ['Température alimentaire','alimentaire','DGAL','Usage pédagogique local'],
  ['Traçabilité qualité','qualite','HAS','Usage pédagogique local'],
  ['Matrice gravité/probabilité','risques','INRS','Usage pédagogique local'],
  ['Hiérarchisation priorités','qualite','INRS','Usage pédagogique local'],
  ['Boucle qualité','qualite','HAS','Usage pédagogique local'],
  ['Cartographie zones','locaux','CPIAS','Usage pédagogique local']
];

(function renderFallback(){
  const body = document.getElementById('mediaFallbackRows');
  body.innerHTML = fallbackMedia.map((m)=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3]}</td></tr>`).join('');
})();

(async function(){
  const data = await loadData('../data/media.json','media',[]);
  const root = document.getElementById('mediaList');
  if (!Array.isArray(data) || data.length === 0) return;
  root.innerHTML = data.map(m => `<article class="card"><h3>${m.title}</h3><img src="../${m.src}" alt="${m.alt}" style="max-width:260px"><p><strong>Thème:</strong> ${(m.tags||[])[0] || (m.seq || m.type || 'général')}</p><p><strong>Source:</strong> ${m.source || m.credit || 'N/A'}</p><p><strong>Licence:</strong> ${m.licence || 'N/A'}</p></article>`).join('');
})();
</script>
</body>
</html>
